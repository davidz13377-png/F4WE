<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; media-src 'self' f4we-media:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https: wss:; font-src 'self' data:">
  <title>F4WE</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg class="svg-sprite" aria-hidden="true">
    <symbol id="icon-home" viewBox="0 0 24 24"><path d="M3 10.8 12 3l9 7.8v9.7a.5.5 0 0 1-.5.5h-5.7v-6.6H9.2V21H3.5a.5.5 0 0 1-.5-.5z"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></symbol>
    <symbol id="icon-library" viewBox="0 0 24 24"><path d="M4 4h3v16H4zM10 4h3v16h-3zM16 5l3-1 4 15-3 1z"/></symbol>
    <symbol id="icon-music" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></symbol>
    <symbol id="icon-heart" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/></symbol>
    <symbol id="icon-album" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1"/></symbol>
    <symbol id="icon-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></symbol>
    <symbol id="icon-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></symbol>
    <symbol id="icon-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6 1.7 1.7 0 0 0 10 3V2.8h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1z"/></symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="icon-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z"/></symbol>
    <symbol id="icon-pause" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></symbol>
    <symbol id="icon-prev" viewBox="0 0 24 24"><path d="M19 20 8 12l11-8zM5 4v16"/></symbol>
    <symbol id="icon-next" viewBox="0 0 24 24"><path d="m5 4 11 8-11 8zM19 4v16"/></symbol>
    <symbol id="icon-shuffle" viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></symbol>
    <symbol id="icon-repeat" viewBox="0 0 24 24"><path d="m17 1 4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"/></symbol>
    <symbol id="icon-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
    <symbol id="icon-volume" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12"/></symbol>
    <symbol id="icon-fullscreen" viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></symbol>
    <symbol id="icon-logout" viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/></symbol>
    <symbol id="icon-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  </svg>
  <div class="titlebar">
    <div class="title-drag"><img src="assets/f4we-icon.png" alt=""><span>F4WE</span></div>
    <div class="window-controls">
      <button data-window="minimize" aria-label="Minimize">—</button>
      <button data-window="maximize" aria-label="Maximize">□</button>
      <button class="close" data-window="close" aria-label="Close">×</button>
    </div>
  </div>

  <div id="auth-screen" class="auth-screen">
    <div class="auth-noise"></div>
    <section class="auth-card">
      <div class="glitch-logo" data-text="F4WE">F4WE</div>
      <p class="eyebrow">DESKTOP FOR WINDOWS</p>
      <h1>Your music.<br><span>Your community.</span></h1>
      <div class="auth-tabs"><button class="active" data-auth-tab="login">Sign in</button><button data-auth-tab="register">Create account</button></div>
      <form id="login-form" class="auth-form">
        <label>Username<input name="username" autocomplete="username" minlength="3" required></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" minlength="8" required></label>
        <button class="primary wide" type="submit">Enter F4WE</button>
      </form>
      <form id="register-form" class="auth-form hidden">
        <label>Username<input name="username" autocomplete="username" minlength="3" required></label>
        <label>Password<input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
        <label>Invite code<input name="accessKey" autocomplete="off" required></label>
        <button class="primary wide" type="submit">Create account</button>
      </form>
      <p id="auth-error" class="form-error"></p>
      <p class="auth-foot">F4WE 1.3.0 · Same account and library as mobile</p>
    </section>
  </div>

  <div id="app-shell" class="app-shell hidden">
    <aside class="sidebar">
      <button class="brand nav-action" data-view="home"><span class="glitch-small" data-text="F4WE">F4WE</span></button>
      <nav class="main-nav">
        <button class="nav-item active" data-view="home"><svg class="nav-icon"><use href="#icon-home"/></svg>Home</button>
        <button class="nav-item" data-view="search"><svg class="nav-icon"><use href="#icon-search"/></svg>Search</button>
        <button class="nav-item" data-view="library"><svg class="nav-icon"><use href="#icon-library"/></svg>Your Library</button>
      </nav>
      <div class="nav-label">YOUR MUSIC</div>
      <nav class="sub-nav">
        <button class="nav-item" data-view="playlists"><svg class="nav-icon"><use href="#icon-music"/></svg>Playlists</button>
        <button class="nav-item" data-view="liked"><svg class="nav-icon"><use href="#icon-heart"/></svg>Liked Songs</button>
        <button class="nav-item" data-view="albums"><svg class="nav-icon"><use href="#icon-album"/></svg>Albums</button>
        <button class="nav-item" data-view="artists"><svg class="nav-icon"><use href="#icon-user"/></svg>Artists</button>
      </nav>
      <div class="nav-label">SOCIAL</div>
      <nav class="sub-nav">
        <button class="nav-item" data-view="friends"><svg class="nav-icon"><use href="#icon-users"/></svg>Friends</button>
        <button class="nav-item" data-view="activity"><svg class="nav-icon"><use href="#icon-bell"/></svg>Activity <b id="notification-badge" class="badge hidden">0</b></button>
      </nav>
      <div class="sidebar-spacer"></div>
      <button class="nav-item settings-nav" data-view="settings"><svg class="nav-icon"><use href="#icon-settings"/></svg>Settings</button>
      <div class="sidebar-user" id="sidebar-user">
        <div class="chrome-avatar"><img id="sidebar-avatar" src="assets/f4we-icon.png" alt=""><img id="sidebar-frame" class="avatar-frame hidden" alt=""></div>
        <div><strong id="sidebar-name">F4WE</strong><small id="sidebar-rank">Access</small></div>
        <button id="logout-button" title="Sign out"><svg class="icon"><use href="#icon-logout"/></svg></button>
      </div>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <div class="history-controls"><button id="back-button">‹</button><button id="forward-button">›</button></div>
        <form id="global-search" class="search-box">
          <svg class="icon"><use href="#icon-search"/></svg><input id="search-input" placeholder="Search songs, artists, albums, playlists..."><kbd>Ctrl K</kbd>
        </form>
        <div class="top-actions">
          <button class="round-button" data-view="activity" aria-label="Notifications"><svg class="icon"><use href="#icon-bell"/></svg><b id="top-notification-dot" class="notification-dot hidden"></b></button>
          <button class="account-pill" data-view="profile"><span class="chrome-avatar"><img id="top-avatar" src="assets/f4we-icon.png" alt=""><img id="top-frame" class="avatar-frame hidden" alt=""></span><span id="top-username">F4WE</span><svg class="icon small"><use href="#icon-chevron-down"/></svg></button>
        </div>
      </header>
      <div id="content-scroll" class="content-scroll"><div id="view" class="view"></div></div>
    </main>

    <aside class="friends-panel">
      <div class="panel-title"><div><p>FRIENDS ACTIVITY</p><h2>Listening Now</h2></div><button data-view="friends"><svg class="icon"><use href="#icon-plus"/></svg></button></div>
      <div id="friends-activity" class="friends-activity"></div>
      <button class="view-all" data-view="friends">View all friends <span>→</span></button>
      <div class="social-card">
        <div class="pulse-ring"><svg class="icon"><use href="#icon-users"/></svg></div>
        <div><strong>Listen together</strong><p>Join a friend and stay perfectly in sync.</p></div>
      </div>
    </aside>

    <footer class="player" id="player">
      <div class="now-playing">
        <div class="cover-wrap"><img id="player-artwork" src="assets/f4we-icon.png" alt=""><div class="cover-glow"></div></div>
        <div class="track-copy"><strong id="player-title">Choose a song</strong><span id="player-artist">F4WE</span></div>
        <button id="like-current" class="icon-button" title="Like"><svg class="icon"><use href="#icon-heart"/></svg></button>
      </div>
      <div class="transport">
        <div class="transport-buttons">
          <button id="shuffle-button" title="Shuffle"><svg class="icon"><use href="#icon-shuffle"/></svg></button><button id="previous-button" title="Previous"><svg class="icon"><use href="#icon-prev"/></svg></button>
          <button id="play-button" class="play-button" title="Play"><svg class="icon"><use href="#icon-play"/></svg></button><button id="next-button" title="Next"><svg class="icon"><use href="#icon-next"/></svg></button>
          <button id="repeat-button" title="Repeat"><svg class="icon"><use href="#icon-repeat"/></svg></button>
        </div>
        <div class="timeline"><span id="elapsed">0:00</span><input id="seek" type="range" min="0" max="100" value="0"><span id="duration">0:00</span></div>
      </div>
      <div class="player-tools"><button id="lyrics-button" title="Lyrics">Lyrics</button><button id="queue-button" title="Queue"><svg class="icon"><use href="#icon-list"/></svg></button><svg class="icon volume-icon"><use href="#icon-volume"/></svg><input id="volume" type="range" min="0" max="1" step="0.01" value="0.82"><button id="fullscreen-button" title="Fullscreen"><svg class="icon"><use href="#icon-fullscreen"/></svg></button></div>
    </footer>
  </div>

  <div id="modal" class="modal-layer hidden"><div class="modal-card"><button class="modal-close" data-close-modal>×</button><div id="modal-content"></div></div></div>
  <div id="toast-stack" class="toast-stack"></div>
  <script src="app.js"></script>
</body>
</html>

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: musicbox
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: musicbox
    ports:
      - "5432:5432"
    volumes:
      - musicbox-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musicbox"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  musicbox-postgres:
